services:
  db:
    image: mariadb:latest
    container_name: radverkehr_db
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
    ports:
      - 3306:3306
    volumes:
      - db-daten:/var/lib/mysql
    networks:
      - db-network
  phpmyadmin:
      image: phpmyadmin/phpmyadmin
      container_name: radverkehr_pma
      restart: always
      ports:
        - 8081:80
      environment:
        - PMA_HOST=db
      networks:
        - db-network
      depends_on:
        - db
networks:
    db-network:
      driver: bridge
volumes:
    db-daten:
